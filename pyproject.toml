[project]
name = "pytauri-next-starter"
version = "0.1.0"
description = "Cross-platform desktop application starter built with Pytauri, Next.js (TypeScript), and Python Wheel — combining modern web UIs with powerful Python backends."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "JeenLabs", email = "your.email@example.com"},
]
keywords = ["tauri", "nextjs", "desktop", "app"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pytauri-wheel==0.8.0",
]

[project.scripts]
pytauri-next-starter = "main:main"

[project.urls]
Homepage = "https://github.com/JeenLabs/pytauri-next-starter"
Repository = "https://github.com/JeenLabs/pytauri-next-starter"
Issues = "https://github.com/JeenLabs/pytauri-next-starter/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "main.py",
    "Tauri.toml",
    "capabilities/default.toml",
    "icons/icon.ico",
    "README.md",
    "LICENSE",
    "out/"
]

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
]
